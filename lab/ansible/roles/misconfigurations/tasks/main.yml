---
# Vulnerabilidades propositadas da Ribeira.
#
# Cada vulnerabilidade é um bloco com um interruptor ribeira_weak_<id>:
#   true  → aplica a configuração vulnerável (para atacar)
#   false → aplica a configuração corrigida (para provar que a correção funciona)
# Assim "Corrigir e Provar" é só mudar o interruptor e voltar a correr o mesmo playbook.
# Nunca ponhas palavras-passe nem chaves no Git: lê-as do ambiente (ver group_vars/all.yml).
#
# Esta role corre no DC01 e no WS01; cada bloco escolhe a máquina certa com um "when".
# Só corre quando pedires de propósito (a tag "never" no site.yml):
#   ansible-playbook site.yml --tags misconfigurations   # todas
#   ansible-playbook site.yml --tags vuln_001            # só a VULN-001

# ═══ VULN-001 — Kerberoasting ═══════════════════════════════════════════════
# Conta de serviço com SPN e palavra-passe fraca. É um objeto do domínio, por
# isso corre só no controlador de domínio. A conta e o SPN existem sempre (um
# serviço precisa deles); o interruptor muda só a força da palavra-passe e a
# cifra permitida (RC4 fraca, 4, ⇄ AES forte, 24).
- name: 'VULN-001 — Kerberoasting (só no controlador de domínio)'
  when: inventory_hostname in groups['domain_controllers']
  tags: [vuln_001]
  block:
    - name: 'VULN-001 | Confirmar a palavra-passe da conta de serviço no ambiente'
      ansible.builtin.assert:
        that:
          - not (ribeira_weak_vuln_001 | bool) or (ribeira_svc_weak_password | length >= 8)
          - (ribeira_weak_vuln_001 | bool) or (ribeira_svc_strong_password | length >= 20)
        fail_msg: >-
          Define RIBEIRA_SVC_WEAK_PASSWORD (estado vulnerável) ou
          RIBEIRA_SVC_STRONG_PASSWORD (estado corrigido, 20+ caracteres) no ambiente.
        quiet: true

    - name: 'VULN-001 | Conta de serviço svc-backup (SPN + palavra-passe)'
      microsoft.ad.user:
        name: svc-backup
        sam_account_name: svc-backup
        upn: "svc-backup@{{ ribeira_domain }}"
        description: Conta de servico do backup SQL (laboratorio Ribeira)
        path: "CN=Users,{{ ribeira_base_dn }}"
        spn:
          set:
            - "MSSQLSvc/backup.{{ ribeira_domain }}:1433"
        password: "{{ ribeira_svc_weak_password if ribeira_weak_vuln_001 | bool else ribeira_svc_strong_password }}"
        update_password: always
        attributes:
          set:
            msDS-SupportedEncryptionTypes: "{{ (4 if ribeira_weak_vuln_001 | bool else 24) | int }}"
        enabled: true
        state: present
      no_log: true

    - name: 'VULN-001 | Resumo'
      ansible.builtin.debug:
        msg: >-
          VULN-001 (Kerberoasting): svc-backup com SPN —
          {{ 'VULNERÁVEL (RC4 + palavra-passe fraca)' if ribeira_weak_vuln_001 | bool else 'CORRIGIDA (AES + palavra-passe forte)' }}

# ═══ VULN-002 — ACL perigosa (ForceChangePassword) ══════════════════════════
# O grupo de suporte "Suporte-TI" (onde está a svc-backup) pode repor a
# palavra-passe da conta de administrador "adm.ti". Os grupos e as contas
# existem sempre; o interruptor só acrescenta ou tira o direito perigoso.
- name: 'VULN-002 — ACL perigosa (só no controlador de domínio)'
  when: inventory_hostname in groups['domain_controllers']
  tags: [vuln_002]
  block:
    - name: 'VULN-002 | Grupo de suporte Suporte-TI (com a svc-backup)'
      microsoft.ad.group:
        name: Suporte-TI
        scope: global
        path: "OU=TI,{{ ribeira_base_dn }}"
        members:
          add:
            - svc-backup
        state: present

    - name: 'VULN-002 | Grupo Admins-TI'
      microsoft.ad.group:
        name: Admins-TI
        scope: global
        path: "OU=TI,{{ ribeira_base_dn }}"
        state: present

    - name: 'VULN-002 | Conta de administrador adm.ti (alvo da ACL)'
      microsoft.ad.user:
        name: adm.ti
        sam_account_name: adm.ti
        upn: "adm.ti@{{ ribeira_domain }}"
        description: Administrador de TI (laboratorio Ribeira)
        path: "OU=TI,{{ ribeira_base_dn }}"
        password: "{{ ribeira_user_password }}"
        update_password: on_create
        groups:
          add:
            - Admins-TI
        enabled: true
        state: present
      no_log: true

    - name: 'VULN-002 | Direito de repor a palavra-passe de adm.ti para o Suporte-TI'
      ansible.windows.win_powershell:
        script: |
          Import-Module ActiveDirectory -ErrorAction Stop
          $weak   = ${{ 'true' if ribeira_weak_vuln_002 | bool else 'false' }}
          $target = Get-ADUser -Identity 'adm.ti'
          $group  = Get-ADGroup -Identity 'Suporte-TI'
          $sid    = [System.Security.Principal.SecurityIdentifier]$group.SID
          # User-Force-Change-Password (direito estendido)
          $guid   = [GUID]'00299570-246d-11d0-a768-00aa006e0529'
          $path   = "AD:\$($target.DistinguishedName)"
          $acl    = Get-Acl -Path $path
          $match  = @($acl.Access | Where-Object {
              $_.ObjectType -eq $guid -and
              $_.ActiveDirectoryRights.ToString().Contains('ExtendedRight') -and
              $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $sid
          })
          if ($weak -and $match.Count -eq 0) {
              $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($sid, 'ExtendedRight', 'Allow', $guid)
              $acl.AddAccessRule($ace)
              Set-Acl -Path $path -AclObject $acl
              $Ansible.Changed = $true
          } elseif (-not $weak -and $match.Count -gt 0) {
              foreach ($ace in $match) { $null = $acl.RemoveAccessRule($ace) }
              Set-Acl -Path $path -AclObject $acl
              $Ansible.Changed = $true
          } else {
              $Ansible.Changed = $false
          }

    - name: 'VULN-002 | Resumo'
      ansible.builtin.debug:
        msg: >-
          VULN-002 (ACL perigosa): Suporte-TI → repor palavra-passe de adm.ti —
          {{ 'VULNERÁVEL (direito concedido)' if ribeira_weak_vuln_002 | bool else 'CORRIGIDA (direito removido)' }}

# ═══ VULN-003 — AD CS ESC1 ══════════════════════════════════════════════════
# Modelo de certificado "RibeiraVPN" clonado do "User". O modelo existe sempre
# (certificados de VPN são legítimos); o interruptor muda só a flag do nome:
#   vulnerável → "enrollee_supplies_subject" (o pedido diz o nome: ESC1)
#   corrigido  → nome construído a partir do AD (cada um só pode pedir para si)
- name: 'VULN-003 — AD CS ESC1 (só no controlador de domínio)'
  when: inventory_hostname in groups['domain_controllers']
  tags: [vuln_003]
  block:
    - name: 'VULN-003 | Modelo de certificado RibeiraVPN'
      microsoft.ad.cs_template:
        name: RibeiraVPN
        display_name: Ribeira VPN
        source_template: User
        schema_version: 2
        key_size: 2048
        extended_key_usages:
          - client_authentication
        certificate_name_flag: >-
          {{ ['enrollee_supplies_subject']
             if ribeira_weak_vuln_003 | bool
             else ['subject_require_directory_path', 'subject_alt_require_upn'] }}
        publish_to_ca:
          - Ribeira-CA
        state: present

    - name: 'VULN-003 | Permitir que os utilizadores do domínio peçam o certificado'
      ansible.windows.win_powershell:
        script: |
          Import-Module ActiveDirectory -ErrorAction Stop
          $configNC = (Get-ADRootDSE).configurationNamingContext
          $tmplDN   = "CN=RibeiraVPN,CN=Certificate Templates,CN=Public Key Services,CN=Services,$configNC"
          $grp      = Get-ADGroup -Identity 'Domain Users'
          $sid      = [System.Security.Principal.SecurityIdentifier]$grp.SID
          # Certificate-Enrollment (direito estendido de pedir certificados)
          $enroll   = [GUID]'0e10c968-78fb-11d2-90d4-00c04f79dc55'
          $path     = "AD:\$tmplDN"
          $acl      = Get-Acl -Path $path
          $has = @($acl.Access | Where-Object {
              $_.ObjectType -eq $enroll -and
              $_.ActiveDirectoryRights.ToString().Contains('ExtendedRight') -and
              $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $sid
          })
          if ($has.Count -eq 0) {
              $aceEnroll = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($sid, 'ExtendedRight', 'Allow', $enroll)
              $aceRead   = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($sid, 'GenericRead', 'Allow')
              $acl.AddAccessRule($aceEnroll)
              $acl.AddAccessRule($aceRead)
              Set-Acl -Path $path -AclObject $acl
              $Ansible.Changed = $true
          } else {
              $Ansible.Changed = $false
          }

    - name: 'VULN-003 | Resumo'
      ansible.builtin.debug:
        msg: >-
          VULN-003 (AD CS ESC1): modelo RibeiraVPN —
          {{ 'VULNERÁVEL (o pedido diz o nome)' if ribeira_weak_vuln_003 | bool else 'CORRIGIDA (nome a partir do AD)' }}

# ═══ VULN-004 — Protocolos sem proteção (LLMNR/NBT-NS + NTLMv1) ══════════════
# Definições de registo no WS01. O interruptor liga (vulnerável) ou desliga
# (corrigido) a resolução de nomes antiga e o envio de NTLMv1.
# Nota: a captura em si (Responder) é um ataque de rede sem evento limpo no
# Windows; a deteção agarra-se ao uso de NTLMv1 (evento 4624).
- name: 'VULN-004 — Protocolos sem proteção (só no posto de trabalho)'
  when: inventory_hostname in groups['workstations']
  tags: [vuln_004]
  block:
    - name: 'VULN-004 | LLMNR (resolução multicast de nomes)'
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
        name: EnableMulticast
        data: "{{ 1 if ribeira_weak_vuln_004 | bool else 0 }}"
        type: dword

    - name: 'VULN-004 | NTLMv1 permitido (LmCompatibilityLevel)'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: LmCompatibilityLevel
        data: "{{ 2 if ribeira_weak_vuln_004 | bool else 5 }}"
        type: dword

    - name: 'VULN-004 | NBT-NS (NetBIOS over TCP/IP) em todas as placas'
      ansible.windows.win_powershell:
        script: |
          $weak = ${{ 'true' if ribeira_weak_vuln_004 | bool else 'false' }}
          $val  = if ($weak) { 1 } else { 2 }   # 1 = ativo, 2 = desativado
          $base = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
          $changed = $false
          Get-ChildItem -Path $base | Where-Object { $_.PSChildName -like 'Tcpip_*' } | ForEach-Object {
              $cur = (Get-ItemProperty -Path $_.PSPath -Name NetbiosOptions -ErrorAction SilentlyContinue).NetbiosOptions
              if ($cur -ne $val) {
                  Set-ItemProperty -Path $_.PSPath -Name NetbiosOptions -Value $val -Type DWord
                  $changed = $true
              }
          }
          $Ansible.Changed = $changed

    - name: 'VULN-004 | Resumo'
      ansible.builtin.debug:
        msg: >-
          VULN-004 (protocolos sem proteção): LLMNR/NBT-NS + NTLMv1 no WS01 —
          {{ 'VULNERÁVEL (ativos)' if ribeira_weak_vuln_004 | bool else 'CORRIGIDA (desligados, NTLMv2 só)' }}
