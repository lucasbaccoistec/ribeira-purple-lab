---
# Vulnerabilidades propositadas da Ribeira.
#
# Cada vulnerabilidade é um bloco com um interruptor ribeira_weak_<id>:
#   true  → aplica a configuração vulnerável (para atacar)
#   false → aplica a configuração corrigida (para provar que a correção funciona)
# Assim "Corrigir e Provar" é só mudar o interruptor e voltar a correr o mesmo playbook.
# Nunca ponhas palavras-passe nem chaves no Git: lê-as do ambiente (ver group_vars/all.yml).
#
# Esta role só corre quando pedires de propósito (a tag "never" no site.yml):
#   ansible-playbook site.yml --tags misconfigurations   # todas
#   ansible-playbook site.yml --tags vuln_001            # só a VULN-001

# ═══ VULN-001 — Kerberoasting ═══════════════════════════════════════════════
# Conta de serviço com SPN e palavra-passe fraca. A conta e o SPN existem
# sempre (um serviço precisa deles); o interruptor muda só a força da
# palavra-passe e a cifra permitida (RC4 fraca, 4, ⇄ AES forte, 24).
- name: 'VULN-001 | Confirmar a palavra-passe da conta de serviço no ambiente'
  ansible.builtin.assert:
    that:
      - not (ribeira_weak_vuln_001 | bool) or (ribeira_svc_weak_password | length >= 8)
      - (ribeira_weak_vuln_001 | bool) or (ribeira_svc_strong_password | length >= 20)
    fail_msg: >-
      Define RIBEIRA_SVC_WEAK_PASSWORD (estado vulnerável) ou
      RIBEIRA_SVC_STRONG_PASSWORD (estado corrigido, 20+ caracteres) no ambiente.
    quiet: true
  tags: [vuln_001]

- name: 'VULN-001 | Conta de serviço svc-backup (SPN + palavra-passe)'
  microsoft.ad.user:
    name: svc-backup
    sam_account_name: svc-backup
    upn: "svc-backup@{{ ribeira_domain }}"
    description: Conta de servico do backup SQL (laboratorio Ribeira)
    path: "CN=Users,{{ ribeira_base_dn }}"
    spn:
      set:
        - "MSSQLSvc/backup.{{ ribeira_domain }}:1433"
    password: "{{ ribeira_svc_weak_password if ribeira_weak_vuln_001 | bool else ribeira_svc_strong_password }}"
    update_password: always
    attributes:
      set:
        msDS-SupportedEncryptionTypes: "{{ (4 if ribeira_weak_vuln_001 | bool else 24) | int }}"
    enabled: true
    state: present
  no_log: true
  tags: [vuln_001]

- name: 'Resumo das vulnerabilidades aplicadas'
  ansible.builtin.debug:
    msg: >-
      VULN-001 (Kerberoasting): svc-backup com SPN —
      {{ 'VULNERÁVEL (RC4 + palavra-passe fraca)' if ribeira_weak_vuln_001 | bool else 'CORRIGIDA (AES + palavra-passe forte)' }}
  tags: [vuln_001]
