---
- name: Instalar o papel de serviços de domínio (AD DS)
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    state: present

# Reinicia sozinho no fim. A palavra-passe do Administrator local passa a ser a do domínio.
- name: Criar a floresta e o domínio
  microsoft.ad.domain:
    dns_domain_name: "{{ ribeira_domain }}"
    domain_netbios_name: "{{ ribeira_netbios }}"
    safe_mode_password: "{{ ribeira_dsrm_password }}"
    install_dns: true
    reboot: true
  no_log: true

- name: O servidor usa-se a si próprio como DNS
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers:
      - 127.0.0.1

- name: Deixar o DNS do domínio resolver nomes da internet
  ansible.windows.win_powershell:
    script: |
      $forwarder = '{{ ribeira_dns_forwarder }}'
      $current = @((Get-DnsServerForwarder).IPAddress | ForEach-Object { $_.ToString() })
      if ($current -notcontains $forwarder) {
          Add-DnsServerForwarder -IPAddress $forwarder
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
